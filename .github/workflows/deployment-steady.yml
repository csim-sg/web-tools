name: Deployment to Steady server

on: 
  push:
    tags:
      - v**-sp*
      - V**-sp*
    branches:
      - stable
env:
  docker: monkeymon/web-tools
jobs:
  build:
    runs-on: ubuntu-latest
    environment: steady
    steps:
    - uses: actions/checkout@v3
    - name: Extract branch name
      shell: bash
      run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF##*/})"
      id: extract_branch
    - name: Build and Push image
      uses: DailyVanity/Publish-Docker-Github-Action@master
      with:
        name: ${{ env.docker }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        dockerfile: Dockerfile
        tags: "latest,${{ steps.extract_branch.outputs.branch }},prod-${{ github.sha}}"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Extract branch name
        shell: bash
        run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF##*/})"
        id: extract_branch
      - name: Setup SOPS
        uses: nhedger/setup-sops@v2
      - name: Run SOPS
        run: |
          cd .github && make decrypt
        env: 
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
      - name: Deployment
        uses: WyriHaximus/github-action-helm3@v3
        with:
          exec: | 
            helm upgrade freetoolsdev $GITHUB_WORKSPACE/.github/app-chart/ --set docker.tag=prod-${{ github.sha}} --install --wait --values=$GITHUB_WORKSPACE/.github/app-chart/values.yaml --values=$GITHUB_WORKSPACE/.github/app-chart/values.prod.yaml
          kubeconfig: '${{ secrets.K8S_HONEYDEW }}'
          overrule_existing_kubeconfig: "true"
